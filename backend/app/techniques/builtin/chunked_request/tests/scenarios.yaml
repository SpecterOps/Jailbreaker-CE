version: 1
scenarios:
  default_flow:
    intent: deterministic chunked intent
    parameters:
      max_rounds: 2
      chunk_size: 50
    attempts:
      - retry_kind: initial
        responses:
          target:
            - first deterministic chunk
            - second deterministic chunk
          target_judge:
            - '{"score":3,"rationale":"flow completed"}'
    selected_attempt_number: 1
