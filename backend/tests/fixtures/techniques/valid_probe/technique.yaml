api_version: "1"
contract_version: "1"
technique:
  id: probe
  version: 1.0.0
  name: Probe
  family: test
  summary: Minimal package used to exercise modular technique loading.
  capabilities:
    - single_shot
  tags:
    - fixture
  target_surfaces:
    - text
implementation:
  id: modular
  kind: workflow
  entrypoint: workflow.yaml
parameters:
  schema: schemas/parameters.json
  presets:
    default:
      temperature: 0
inputs:
  - id: intent
    kind: text
    required: true
model_roles:
  - id: target
  - id: target_judge
histories:
  - id: audit_history
    visible_to:
      - target_judge
judges:
  - id: target_judge
    role: target_judge
    schedule: run_end
    purposes:
      - official_score
    evidence:
      - intent
      - target_response
result_policy:
  official_judge: target_judge
  final_response: target_response
  success_threshold: 7
detectors:
  - id: refusal
    inputs:
      - target_response
seed:
  strategy: none
presentation:
  conversation_format: generation
metrics:
  - id: score
    source: target_judge
recommended_limits:
  max_rounds: 1
assets:
  - workflow.yaml
  - schemas/parameters.json
state_schema_version: 1
result_schema_version: 1
source:
  kind: builtin
extensions:
  fixture.note: valid
